name: Render and Publish Quarto Site

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Render site
        run: quarto render

      # PROD: main branch
      - name: Publish PROD
        if: github.ref == 'refs/heads/main'
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
        env:
          GITHUB_PAGES_URL: "https://$GITHUB_ACTOR.github.io/$GITHUB_REPOSITORY/"
          
      - name: Show PROD URL
        if: github.ref == 'refs/heads/main'
        run: echo "✅ PROD site is live at: https://$GITHUB_ACTOR.github.io/${GITHUB_REPOSITORY}/"

      # DEV: any non-main branch
      - name: Publish DEV
        if: github.ref != 'refs/heads/main'
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
          destination: dev/${{ github.ref_name }}

      - name: Show DEV URL
        if: github.ref != 'refs/heads/main'
        run: |
          BRANCH_URL="https://$GITHUB_ACTOR.github.io/${GITHUB_REPOSITORY}/dev/${GITHUB_REF_NAME}/"
          echo "🧪 DEV site for branch '${GITHUB_REF_NAME}' is live at: $BRANCH_URL"