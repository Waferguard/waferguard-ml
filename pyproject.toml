[project]
name = "waferguard-ml"
version = "0.1.0"
description = ""
authors = [
    {name = "oliversinn",email = "oliver.mazariegos98@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "tensorflow (>=2.20.0,<3.0.0)",
    "pandas (>=3.0.0,<4.0.0)",
    "kagglehub (>=0.4.1,<0.5.0)",
    "matplotlib (>=3.10.8,<4.0.0)",
    "seaborn (>=0.13.2,<0.14.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "ruff (>=0.14.14,<0.15.0)",
    "notebook (>=7.5.2,<8.0.0)"
]


[tool.ruff]
target-version = "py311"
line-length = 120
fix = false
preview = true
lint.select = [
    "E", # pycodestyle
    "W", # pycodestyle
    "F", # Pyflakes
    "B", # flake8-bugbear
    "C4", # flake8-comprehensions
    "D", # flake8-docstrings
    "I", # isort
    "SIM", # flake8-simplify
    "TCH", # flake8-type-checking
    "TID", # flake8-tidy-imports
    "Q", # flake8-quotes
    "UP", # pyupgrade
    #"PT", # flake8-pytest-style
    "RUF", # Ruff-specific rules,
    "ERA", # eradicate,
    "T20", # flamke8-print
    "N", # pep8-naming
    "Q", # flake8-quotes
]

lint.ignore = [
    "D100", # missing docstring in public module
    "D101", # missing docstring in public class
    "D102", # missing docstring in public method
    "D103", # missing docstrinc in public function
    "D104", # missing docstring public package
    "D105", # missing docstring in magic method
    "D106", # missing docstring in public nested class
    "D107", # missing docstring in __init__
    "D203", # one-blank-line-before-class
    "D204", # no-blank-line-before-class
    "D205", #
    "D401",
    "UP015",
    "D404",
    "D417",
    "D213", # multi-line-summary-second-line
    "E501", # Line too long
    "ERA001",
    "UP007",
    "B008",
    "T201",

]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
skip-magic-trailing-comma = false
docstring-code-format = true
docstring-code-line-length = 88
